name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar
        run: python -m pip install -e .[dev]
      - name: Testes
        run: python -m pytest -q
      - name: CLI instalada responde
        run: alcance --help
